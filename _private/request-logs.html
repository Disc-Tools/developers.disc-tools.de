<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#14151c">
    <link rel="icon" type="image/svg+xml" href="/static/assets/img/logo.svg">
    <title>Request logs | Disc-Tools</title>
    <link rel="stylesheet" href="/static/assets/developers.css?v=31">
</head>
<body class="portal-page">
    <header class="site-header">
        <div class="header-row">
            <a class="brand" href="/" aria-label="Disc-Tools Developers home">
                <img src="/static/assets/img/logo.svg" alt="" width="32" height="32">
                <span>Developers</span>
            </a>
            <div class="login-actions">
                <details class="account-menu" id="account-menu">
                    <summary id="account-toggle">
                        <img class="account-avatar" id="account-avatar" src="/static/assets/img/logo.svg" alt="" width="28" height="28">
                        <span class="account-name" id="account-name">Discord account</span>
                    </summary>
                    <div class="account-links">
                        <button id="logout-button" type="button">Sign out</button>
                    </div>
                </details>
            </div>
        </div>
    </header>

    <div class="portal-layout">
        <nav class="portal-sidebar" aria-label="Developer portal">
            <details class="sidebar-group" data-sidebar-group="workspace">
                <summary>Workspace</summary>
                <a href="/portal/"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Overview</a>
            </details>
            <details class="sidebar-group" data-sidebar-group="api">
                <summary>API</summary>
                <a href="/portal/api-tokens/"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 8a5 5 0 0 1-6.8 4.7L6 21H3v-3l2-2h2v-2l3.3-3.2A5 5 0 1 1 21 8Z"/><circle cx="16.5" cy="7.5" r="1"/></svg>API tokens</a>
                <a href="/portal/documentation/"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg>Documentation</a>
            </details>
            <details class="sidebar-group" data-sidebar-group="monitoring" open>
                <summary>Monitoring</summary>
                <a href="/portal/usage/"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18M8 16v-4m5 4V8m5 8V5"/></svg>Usage</a>
                <a href="/portal/request-logs/" aria-current="page"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/></svg>Request logs</a>
            </details>
            <a class="sidebar-home" href="/"><svg class="portal-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 9v12h14V9m-9 12v-6h4v6"/></svg>Back to home</a>
        </nav>
        <main class="portal-main" data-activity="request-logs">
            <div class="portal-intro"><h1>Request logs</h1></div>
            <form class="activity-filters" id="activity-filters">
                <label>Period <select name="period"><option value="1d">Last 24 hours</option><option value="7d" selected>Last 7 days</option><option value="30d">Last 30 days</option></select></label>
                <label>API key <select name="key"><option value="">All keys</option></select></label>
                <label>Status <select name="status"><option value="">All statuses</option><option value="failed">Errors only</option></select></label>
                <label>Day (UTC) <input type="date" name="day"></label>
                <button class="token-action" type="submit">Apply filters</button>
            </form>
            <p id="activity-status" role="status">Loading activity…</p>
            <div class="token-table-scroll" tabindex="0" role="region" aria-label="API activity">
                <table class="token-table" aria-label="Request logs">
                    <thead><tr><th scope="col">Time</th><th scope="col">Key</th><th scope="col">Endpoint</th><th scope="col">Status</th><th scope="col">Processing time</th><th scope="col">Request ID</th></tr></thead>
                    <tbody id="activity-rows"></tbody>
                </table>
            </div>
            <p id="login-status" role="status"></p>
        </main>
    </div>
    <script defer src="/static/assets/sidebar.js"></script>
    <script defer src="/static/assets/account.js?v=3"></script>
    <script defer src="/static/assets/activity.js"></script>
    <script defer src="/static/assets/cookie-notice.js?v=2"></script>
</body>
</html>
