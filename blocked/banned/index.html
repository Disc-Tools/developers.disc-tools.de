<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#14151c">
    <link rel="icon" type="image/svg+xml" href="/static/assets/img/logo.svg">
    <title>Access banned | Disc-Tools</title>
    <link rel="stylesheet" href="/static/assets/developers.css?v=42">
</head>
<body>
    <header class="site-header">
        <div class="header-row">
            <a class="brand" href="/" aria-label="Disc-Tools Developers home">
                <img src="/static/assets/img/logo.svg" alt="" width="32" height="32">
                <span>Developers</span>
            </a>
        </div>
    </header>
    <main class="wrap error-page">
        <section class="error-panel" aria-labelledby="error-title">
            <p class="error-label">Disc-Tools Developers</p>
            <h1 id="error-title">Access banned</h1>
            <p>This Discord account is banned from Disc-Tools developer access.</p>
            <p>If you think this was a mistake, contact Disc-Tools support.</p>
            <div class="error-actions">
                <button class="error-action" id="banned-logout" type="button">Back to developer home</button>
                <a class="error-action" href="mailto:info@disc-tools.de">Contact support</a>
            </div>
            <p id="banned-status" role="status"></p>
        </section>
    </main>
    <script>
        document.getElementById('banned-logout').addEventListener('click', async event => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/developer-logout', { method: 'POST' });
                if (!response.ok) throw new Error();
                window.location.replace('/');
            } catch {
                document.getElementById('banned-status').textContent = 'Could not sign out. Try again.';
                button.disabled = false;
            }
        });
    </script>
    <script defer src="/static/assets/cookie-notice.js?v=7"></script>
</body>
</html>
